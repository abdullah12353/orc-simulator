name: CI

# Heavy testing lives here, not on dev machines. Standard ubuntu-latest runners only (free for a
# public repo); never larger runners.
on:
  push:
    branches: [build/mvp, 'ticket/**', main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, content, Seam A
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Content check
        run: npm run content:check
      - name: Seam A (sim core), long multi-seed runs
        run: npm run test:unit
        env:
          ORC_SEEDS: 500
      - run: npm run build:web
        env:
          VITE_NEON_AUTH_URL: https://ci.neonauth.example.invalid/neondb/auth
          VITE_DATA_API_URL: https://ci.apirest.example.invalid/neondb/rest/v1
          VITE_WORKER_URL: https://ci-worker.example.invalid

  seam-b:
    name: Seam B (backend on Postgres 18.6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:db starts db/compose.yaml's Postgres 18.6 container, applies db/local-shim.sql and this
      # commit's migrations to a fresh database, then runs the suite. The end-to-end test (`npm run smoke`)
      # runs locally against Neon's dev branch, which CI has no credentials for.
      - name: Seam B suite
        run: npm run test:db
